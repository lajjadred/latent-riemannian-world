[build-system]
requires = ["setuptools>=72"]
build-backend = "setuptools.build_meta"

[project]
name = "latent-riemannian-world"
version = "0.2.0"
description = "Riemannian geometry and Bayesian inference for diffusion model latent spaces"
readme = "README.md"
license = { text = "BSL-1.1" }
requires-python = ">=3.12"
authors = [{ name = "lajjadred" }]
keywords = ["riemannian-geometry", "latent-space", "diffusion-models", "geodesic", "world-models"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "torch>=2.4",
    "numpy>=1.26",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://github.com/lajjadred/latent-riemannian-world"
Repository = "https://github.com/lajjadred/latent-riemannian-world"
Issues = "https://github.com/lajjadred/latent-riemannian-world/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
